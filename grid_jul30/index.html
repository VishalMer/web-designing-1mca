<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        body{
            background-color: black;
            background-image: url('../images/Moon.png');
            background-size: cover;
        }
        .main{
            border: 2px solid rgba(192, 191, 192, 0.674);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(7, 100px);
            grid-template-areas: "logo nav nav nav"
                                    "sbar  p1 p1 p1"
                                    "sbar img1 img2 p2"
                                    "sbar cont1 cont1 p2"
                                    "img3 img4 img5 img6"
                                    "cont2 cont2 cont3 cont3"
                                    "footer footer footer footer";
        }
        .logo{
            grid-area: logo;
        }
        .nav{
            grid-area: nav;
        }
        .sbar{
            grid-area: sbar;
        }
        .p1{
            grid-area: p1;
        }
        .p2{
            grid-area: p2;
        }
        .img1{
            grid-area: img1;
        }
        .img2{
            grid-area: img2;
        }
        .img3{
            grid-area: img3;
        }
        .img4{
            grid-area: img4;
        }
        .img5{
            grid-area: img5;
        }
        .img6{
            grid-area: img6;
        }
        .cont1{
            grid-area: cont1;
        }.cont2{
            grid-area: cont2;
        }.cont3{
            grid-area: cont3;
        }.footer{
            grid-area: footer;
        }
        .grid_item{
            border: 2px solid rgba(192, 191, 192, 0.674);
            /* height: 100px; */
            color: aliceblue;
            text-align: center;
            font-weight: 700;
            text-transform: capitalize;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="grid_item logo">logo</div>
        <div class="grid_item nav">nav</div>
        <div class="grid_item sbar">sidebar</div>
        <div class="grid_item p1">pra1</div>
        <div class="grid_item img1">img1</div>
        <div class="grid_item img2">img2</div>
        <div class="grid_item cont1">cont1</div>
        <div class="grid_item p2">para2</div>
        <div class="grid_item img3">img3</div>
        <div class="grid_item img4">img4</div>
        <div class="grid_item img5">img5</div>
        <div class="grid_item img6">img6</div>
        <div class="grid_item cont2">cont2</div>
        <div class="grid_item cont3">cont3</div>
        <div class="grid_item footer">footer</div>
    </div>
</body>
</html>

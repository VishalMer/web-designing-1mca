<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
        }
        .container {
            display: flex;
            
            justify-content: space-evenly;
            gap: 20px;
        }
        .details {
            width: 50%;
        }
        .container img {
            width: 400px;
            height: 350px;
            border-radius: 8%;
        }
        nav{
            height: 200px;
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
        }
        nav ul{
            display: inline-flex;
        }
        nav ul li{
            padding: 0% 10px;
            list-style-type: none;
            
        }
        nav ul li a{
            color: #ffffff;
            font-weight: 700;
            font-family: poppins, Verdana, Geneva, Tahoma, sans-serif;
            text-decoration: none;
        }
        h2{
            color: burlywood;
        }
        .active{
            color: burlywood;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><img src="Rahul.jpg" alt="logo" width="100px" height="50px"></div>
        <ul>
            <li><a class="active" href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="profile-pic">
            <img src="rahul.jpg" alt="Profile Picture">
        </div>
        <div class="details">
            <h4>Hello, I'm</h4>
            <h2>Rahul Zapadiya</h2>
            <h3>And I'm a web developer</h3>
            <p>I create responsive and user-friendly websites using modern web technologies.
                 I have experience with HTML, CSS, JavaScript, and various web development frameworks.
            </p>
        </div>
    </div>
</body>
</html>
